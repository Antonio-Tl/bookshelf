name: Smoke-Tests

# Bei jedem Push und Pull Request: Seite und Worker lokal mit wrangler dev starten und die wichtigsten Wege
# im Browser durchklicken (tests/smoke.spec.js). Liest nur öffentliche Daten aus Supabase, schreibt nichts.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
